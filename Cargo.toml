[package]
name = "panamax"
version = "1.0.14"
authors = ["k3d3 <k@3d3.ca>"]
description = "Mirror rustup and crates.io repositories, for offline Rust and Cargo usage."
license = "MIT/Apache-2.0"
readme = "README.md"
homepage = "https://github.com/panamax-rs/panamax"
repository = "https://github.com/panamax-rs/panamax"
edition = "2024"
# MSRV: the oldest rustc that can compile the current dependency tree
# (clap/indicatif/hyper-util/toml declare 1.85; the icu/encoding_rs/idna
# transitive resolutions in Cargo.lock require 1.88).
rust-version = "1.88"

[dependencies]
reqwest = { version = "0.12" }
indicatif = "0.18"
clap = { version = "4.1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
console = "0.15"
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"
url = "2.2"
glob = "0.3"
git2 = "0.21"
http = "1"
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.25", features = ["full"] }
warp = { version = "0.4", features = ["server", "test"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
tokio-rustls = "0.26"
rustls = "0.23"
askama = "0.11"
include_dir = "0.7"
bytes = "1.1"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
walkdir = "2.3"
toml = "1"

[dev-dependencies]
tempfile = "3"

[features]
default = []
dev_reduced_crates = []
vendored-openssl = ["reqwest/native-tls-vendored"]
